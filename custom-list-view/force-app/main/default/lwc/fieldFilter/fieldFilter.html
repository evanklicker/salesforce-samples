<template>
    <div class="wrapper" data-id={dataId}>
        <a class="filterContentWrapper" onclick={selectThis}>
            <div class="fieldLabel">
                {displayedFieldSelection.label}
                <template if:true={hasPendingChanges}>
                    <span>*</span>
                </template>
            </div>
            <span class="operatorAndValue">
                <span>{displayedOperatorSelection.label}</span>
                &nbsp;
                <span>{displayedFilterValue}</span>
            </span>
        </a>
        <lightning-button-icon class="delete" variant="bare" icon-name="utility:close" onclick={deleteThis}></lightning-button-icon>
    </div>
    <template if:true={showEditPopover}>
        <span class="slds-is-relative">
            <div class="popoverContainer">
                <div class="slds-popover slds-nubbin_right">
                    <div class="slds-popover__body">
                        <div>
                            <lightning-combobox label="Field" value={popoverFieldSelection.value} options={fieldOptions}
                                                onchange={handlePopoverFieldChanged}></lightning-combobox>
                        </div>
                        <br>
                        <div>
                            <lightning-combobox label="Operator" value={popoverOperatorSelection.value} options={operatorOptions}
                                                onchange={handlePopoverOperatorChanged}></lightning-combobox>
                        </div>
                        <br>
                        <div>
                            <lightning-input label="Value" value={popoverFilterValue} type={filterValueType} onchange={handlePopoverValueChanged}></lightning-input>
                        </div>
                        <div>
                            <lightning-button style="float: right" class="slds-p-vertical_small" label="Done"
                                              onclick={popoverDoneClicked}></lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </span>
    </template>
</template>
