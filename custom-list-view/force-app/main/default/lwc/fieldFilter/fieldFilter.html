<template>
    <div class="wrapper">
        <a onclick={selectThis}>
            <span class="filterContentWrapper">
                <div class="fieldLabel">
                    {fieldSelection.label}
                    <span>*</span>
                    &nbsp;
                    {initialIndex}
                </div>
                <span class="operatorAndValue">
                    <span>{operatorSelection.label}</span>
                    &nbsp;
                    <span>{filterValue}</span>
                </span>
            </span>
        </a>
        <lightning-button-icon class="delete" variant="bare" icon-name="utility:close" onclick={deleteThis}></lightning-button-icon>
    </div>
    <!-- <section class="slds-popover slds-nubbin_right" role="dialog"> -->
    <template if:true={showEditPopover}>
        <span class="slds-is-relative">
            <div class="popoverContainer">
                <div class="slds-popover slds-nubbin_right">
                    <div class="slds-popover__body">
                        <div>
                            <lightning-combobox label="Field" value={fieldSelection.value} options={fieldOptions}
                                                onchange={handleFieldChanged}></lightning-combobox>
                        </div>
                        <br>
                        <div>
                            <lightning-combobox label="Operator" value={operatorSelection.value} options={operatorOptions}
                                                onchange={handleOperatorChanged}></lightning-combobox>
                        </div>
                        <br>
                        <div>
                            <lightning-input label="Value" value={filterValue} type={filterValueType} onchange={handleValueChanged}></lightning-input>
                        </div>
                        <div>
                            <lightning-button style="float: right" class="slds-p-vertical_small" label="Done" onclick={handleDoneClicked}></lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </span>
    </template>

</template>
